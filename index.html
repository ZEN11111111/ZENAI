<!doctype html><html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ZENAI 2.0</title>
<style>
:root{--bg:#0b0e12;--panel:#12171d;--panel2:#1a2129;--line:#2a333d;--text:#f4f7fa;--muted:#8d98a5;--blue:#4e7cff;--user:#2f64ee}
*{box-sizing:border-box}body{margin:0;height:100dvh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
.app{height:100%;display:flex}.side{width:270px;background:var(--panel);border-right:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px}
.logo{font-size:23px;font-weight:800}.new{border:0;border-radius:12px;padding:12px;background:#fff;color:#111;font-weight:700}.chats{flex:1;overflow:auto}.chat{padding:11px;border-radius:10px;color:#cbd4df;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat.active,.chat:hover{background:var(--panel2);color:#fff}
.sideBtns{display:grid;grid-template-columns:1fr 1fr;gap:7px}.sideBtns button,.icon{border:1px solid var(--line);background:transparent;color:#d7dee7;border-radius:10px;padding:9px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;background:rgba(11,14,18,.88);backdrop-filter:blur(9px)}.title{font-weight:750}.status{margin-left:auto;font-size:12px;color:#8ee0a5}.menu{display:none}
.messages{flex:1;overflow:auto}.inner{max-width:900px;margin:auto;padding:28px 18px 145px}.hero{text-align:center;padding:15vh 10px;color:var(--muted)}.hero h1{font-size:46px;margin:0 0 10px;color:#fff}
.msg{display:flex;gap:10px;margin:21px 0}.msg.user{justify-content:flex-end}.avatar{width:30px;height:30px;flex:none;border-radius:9px;background:#202a36;display:grid;place-items:center;font-size:11px;font-weight:800}.user .avatar{background:#214dc4}.card{max-width:78%}.user .card{display:flex;flex-direction:column;align-items:flex-end}.bubble{padding:12px 15px;border-radius:16px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.assistant .bubble{background:var(--panel2)}.user .bubble{background:var(--user)}.meta{font-size:10px;color:var(--muted);margin:5px}.actions{display:flex;gap:6px;margin-top:6px}.action{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:4px 7px;font-size:11px}
.thinking{border:1px solid var(--line);background:rgba(26,33,41,.7);padding:10px 12px;border-radius:14px;margin-bottom:8px}.thinkHead{font-size:12px;color:#c9d2dd;display:flex;align-items:center;gap:8px}.spinner{width:12px;height:12px;border:2px solid #46515e;border-top-color:#8fb1ff;border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.summary{display:none;color:#96a1ad;font-size:11px;line-height:1.5;white-space:pre-wrap;margin-top:8px}.summary.show{display:block}
.composerWrap{position:fixed;left:270px;right:0;bottom:0;padding:11px 16px calc(11px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(11,14,18,.98) 28%)}.composer{max-width:900px;margin:auto;display:flex;align-items:flex-end;gap:7px;background:var(--panel2);border:1px solid #37424e;border-radius:17px;padding:8px}.composer textarea{flex:1;border:0;background:transparent;color:#fff;outline:0;resize:none;min-height:48px;max-height:180px;padding:10px;font:inherit;line-height:1.45}.send{width:44px;height:44px;border:0;border-radius:12px;background:#fff;color:#111;font-size:18px}.send.stop{background:#303944;color:#fff}.icon{width:40px;height:40px;padding:0}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:20;padding:18px}.modal.show{display:flex;align-items:center;justify-content:center}.modalCard{width:min(620px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.modalHead{display:flex;justify-content:space-between}.modalHead button{border:0;background:none;color:#fff;font-size:18px}.row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
@media(max-width:700px){.side{position:fixed;z-index:30;left:0;top:0;bottom:0;transform:translateX(-102%);transition:.2s;width:min(82vw,300px)}.side.open{transform:translateX(0)}.menu{display:block;border:0;background:none;color:#fff;font-size:22px;margin-right:10px}.composerWrap{left:0;padding-left:8px;padding-right:8px}.inner{padding-left:10px;padding-right:10px}.card{max-width:88%}}
</style></head><body>
<div class="app"><aside class="side" id="side"><div class="logo">ZENAI <small style="color:#4e7cff">2.0</small></div><button class="new" id="newBtn">＋ 新しいチャット</button><div class="chats" id="chats"></div><div class="sideBtns"><button id="exportBtn">保存</button><button id="importBtn">読込</button><button id="themeBtn">テーマ</button><button id="settingsBtn">設定</button></div><input id="fileInput" type="file" accept=".json" hidden></aside>
<main class="main"><header class="top"><button class="menu" id="menuBtn">☰</button><div class="title" id="title">ZENAI 2.0</div><div class="status" id="status">● 接続確認中…</div></header><section class="messages" id="messages"><div class="inner" id="inner"></div></section>
<div class="composerWrap"><div class="composer"><button class="icon" id="voice" title="音声入力">🎙</button><textarea id="input" placeholder="ZENAIにメッセージを送る…"></textarea><button class="send" id="send">➤</button></div></div></main></div>
<div class="modal" id="modal"><div class="modalCard"><div class="modalHead"><b>設定</b><button id="close">✕</button></div><div class="row"><div>思考サマリー<small style="display:block;color:#8d98a5">公開可能な思考要約を表示</small></div><input type="checkbox" id="thoughts" checked></div><div class="row"><div>思考レベル</div><select id="level"><option value="low">低</option><option value="medium" selected>中</option><option value="high">高</option></select></div></div></div>
<script>
const K="zenai20",P="zenai20prefs";let chats=JSON.parse(localStorage.getItem(K)||"[]"),prefs=JSON.parse(localStorage.getItem(P)||'{"showThoughts":true}'),cur=null,ctl=null,busy=false;
const $=i=>document.getElementById(i),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),uid=()=>crypto.randomUUID();
function persist(){localStorage.setItem(K,JSON.stringify(chats));localStorage.setItem(P,JSON.stringify(prefs))}
function make(){cur={id:uid(),title:"新しいチャット",messages:[],interactionId:null};chats.unshift(cur);persist();render()}
function list(){$("chats").innerHTML=chats.map(c=>`<div class="chat ${cur&&c.id===cur.id?"active":""}" data-id="${c.id}">${esc(c.title)}</div>`).join("");document.querySelectorAll(".chat").forEach(x=>x.onclick=()=>{cur=chats.find(c=>c.id===x.dataset.id);render();$("side").classList.remove("open")})}
function render(){list();$("title").textContent=cur?.title||"ZENAI 2.0";let w=$("inner");if(!cur||!cur.messages.length){w.innerHTML='<div class="hero"><h1>ZENAI</h1><p>考えて、答えて、いっしょに進めよう。</p></div>';return}w.innerHTML=cur.messages.map((m,i)=>`<div class="msg ${m.role}"><div class="avatar">${m.role==="user"?"YOU":"AI"}</div><div class="card"><div class="bubble">${esc(m.content)}</div><div class="meta">${m.role==="user"?"あなた":"ZENAI"}</div>${m.role==="assistant"?`<div class="actions"><button class="action" onclick="copyMsg(${i})">コピー</button><button class="action" onclick="retry(${i})">再生成</button></div>`:""}</div></div>`).join("");$("messages").scrollTop=$("messages").scrollHeight}
async function copyMsg(i){try{await navigator.clipboard.writeText(cur.messages[i].content)}catch{}}
async function retry(i){let u=cur.messages[i-1];if(u?.role==="user"){cur.messages=cur.messages.slice(0,i-1);$("input").value=u.content;await send()}}
function height(){let t=$("input");t.style.height="auto";t.style.height=Math.min(t.scrollHeight,180)+"px"}
function live(i){let m=cur.messages[i];$("live").textContent=m.content;if(m.content)$("thinkLabel").textContent="回答を生成中…";if(m.thought&&prefs.showThoughts){$("summary").textContent=m.thought;$("summary").classList.add("show")}$("messages").scrollTop=$("messages").scrollHeight}
function finish(i){render()}
async function send(){if(busy)return;let text=$("input").value.trim();if(!text)return;if(!cur)make();if(cur.title==="新しいチャット")cur.title=text.slice(0,28);cur.messages.push({role:"user",content:text});$("input").value="";height();render();busy=true;ctl=new AbortController();$("send").classList.add("stop");$("send").textContent="■";
cur.messages.push({role:"assistant",content:"",thought:""});let i=cur.messages.length-1;$("inner").insertAdjacentHTML("beforeend",`<div class="msg assistant"><div class="avatar">AI</div><div class="card"><div class="thinking"><div class="thinkHead"><span class="spinner"></span><span id="thinkLabel">考えています…</span></div><div class="summary" id="summary"></div></div><div class="bubble" id="live"></div><div class="meta">ZENAI</div></div></div>`);
try{let r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},signal:ctl.signal,body:JSON.stringify({message:text,interactionId:cur.interactionId,thinkingLevel:$("level").value})});if(!r.ok)throw Error((await r.text()).slice(0,700));let rd=r.body.getReader(),de=new TextDecoder(),buf="";while(true){let {value,done}=await rd.read();if(done)break;buf+=de.decode(value,{stream:true});let ls=buf.split("\n");buf=ls.pop();for(let line of ls){if(!line.startsWith("data:"))continue;let raw=line.slice(5).trim();if(!raw||raw==="[DONE]")continue;let e=JSON.parse(raw);if(e.type==="interaction")cur.interactionId=e.id;if(e.type==="thought")cur.messages[i].thought+=(e.text||"");if(e.type==="text")cur.messages[i].content+=(e.text||"");if(e.type==="done"&&e.interactionId)cur.interactionId=e.interactionId;if(e.type==="error")throw Error(e.message);live(i)}}finish(i);persist()}catch(e){if(e.name==="AbortError"){cur.messages[i].content+="\n\n[生成を停止しました]"}else cur.messages[i].content="エラー: "+e.message;finish(i);persist()}finally{busy=false;ctl=null;$("send").classList.remove("stop");$("send").textContent="➤"}}
$("newBtn").onclick=make;$("send").onclick=()=>busy?ctl.abort():send();$("input").oninput=height;$("input").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};$("menuBtn").onclick=()=>$("side").classList.toggle("open");
$("themeBtn").onclick=()=>document.body.classList.toggle("light");
$("settingsBtn").onclick=()=>{$("modal").classList.add("show");$("thoughts").checked=prefs.showThoughts};$("close").onclick=()=>$("modal").classList.remove("show");$("thoughts").onchange=e=>{prefs.showThoughts=e.target.checked;persist()};
$("exportBtn").onclick=()=>{let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(chats,null,2)],{type:"application/json"}));a.download="zenai20.json";a.click()};$("importBtn").onclick=()=>$("fileInput").click();$("fileInput").onchange=async e=>{try{chats=JSON.parse(await e.target.files[0].text());cur=chats[0]||null;persist();render()}catch{alert("読み込めません")}};
let rec=null;if(window.SpeechRecognition||window.webkitSpeechRecognition){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;rec=new SR();rec.lang="ja-JP";rec.interimResults=true;rec.onresult=e=>{let t="";for(let j=e.resultIndex;j<e.results.length;j++)t+=e.results[j][0].transcript;$("input").value=t;height()}}$("voice").onclick=()=>rec?rec.start():alert("このブラウザは音声入力非対応です");
if(!chats.length)make();else{cur=chats[0];render()}fetch("/api/health").then(r=>{if(!r.ok)throw 0;$("status").textContent="● 接続中"}).catch(()=>{$("status").textContent="● 接続エラー"});
</script></body></html>
